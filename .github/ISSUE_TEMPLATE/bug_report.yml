name: Bug Report
description: Report a simulator, WebGL2 rendering, audio, or UI defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: machine
    attributes:
      label: Machine ID or Scene
      description: Which machine or scene exhibited the problem?
      placeholder: "pc20 / m6502 / alife / hub"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Exact actions, assembly/GLSL input, and whether opened via file:// or http://
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, OS & GPU
      placeholder: "Chrome 134, Windows 11, RTX 5070 Ti"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lab version
      description: Shown in the README badge, the `VERSION` file, or the .exe's file properties.
      placeholder: "6.0.0 (web) / 6.0.0 (.exe)"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What you expected to happen, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console output (optional)
      description: Errors from DevTools (F12 → Console), if any.
      render: shell
