name: CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Audit, unit tests, CPU conformance & browser suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["26"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Prettier format check
        run: npx --yes prettier@3.10.1 --check "**/*.{html,css,js,mjs,json,md,yml}"

      - name: ESLint correctness rules
        run: npx --yes eslint@9.39.5 .

      - name: Static & symbol audit
        run: node tools/audit-exhaustive.mjs

      - name: Unit tests (simulators, RV32 pipeline vs ISS, golden values, security, analog compiler)
        run: node --test tests/*.test.mjs

      - name: Klaus Dormann 6502 functional test (GPL-3 binary fetched at CI time, not vendored)
        run: node tools/dormann-6502.mjs

      - name: Modular HTML/JS & headless WebGL2 suite
        run: node tools/run-tests.mjs --ci-headless-optional
