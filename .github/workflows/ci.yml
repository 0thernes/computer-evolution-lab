name: CI

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Audit, unit tests, CPU conformance & browser suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}

      - name: Prettier format check
        run: npx --yes prettier@3.10.1 --check "**/*.{html,css,js,mjs,json,md,yml}"

      - name: Static & symbol audit
        run: node tools/audit-exhaustive.mjs

      - name: Unit tests (simulators, RV32 pipeline vs ISS, golden values, security, analog compiler)
        run: node --test tests/*.test.mjs

      - name: Klaus Dormann 6502 functional test (GPL-3 binary fetched at CI time, not vendored)
        run: node tools/dormann-6502.mjs

      - name: Modular HTML/JS & headless WebGL2 suite
        run: node tools/run-tests.mjs --ci-headless-optional
